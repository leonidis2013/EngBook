<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EngBook">
  <meta name="format-detection" content="telephone=no">
  <title>EngBook</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    /* Loading screen: a part drafting itself on a blueprint grid.
       Pure SVG + CSS (no images, no script), so it shows instantly and costs almost nothing. */
    #loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background:
      linear-gradient(rgba(34,195,230,.07) 1px, transparent 1px) 0 0 / 20px 20px,
      linear-gradient(90deg, rgba(34,195,230,.07) 1px, transparent 1px) 0 0 / 20px 20px,
      linear-gradient(rgba(34,195,230,.13) 1px, transparent 1px) 0 0 / 100px 100px,
      linear-gradient(90deg, rgba(34,195,230,.13) 1px, transparent 1px) 0 0 / 100px 100px, #0d0f12;
      color: #e6e9ee; font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; transition: opacity .35s ease; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(420px, 86vw); }
    #loader svg { width: 100%; height: auto; overflow: visible; }
    #loader .part, #loader .hole { fill: none; stroke: #e6e9ee; stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    #loader .cl { stroke: #8a93a0; stroke-width: .8; stroke-dasharray: 8 3 2 3; opacity: 0; }
    #loader .dim { stroke: #22c3e6; stroke-width: 1; fill: none; opacity: 0; }
    #loader .arw { fill: #22c3e6; opacity: 0; }
    #loader .txt { fill: #22c3e6; font-size: 11px; font-family: inherit; opacity: 0; }
    #loader .pencil { opacity: 0; }
    #loader .part { animation: eb-draw 5s cubic-bezier(.5,.1,.4,1) infinite; }
    #loader .hole { animation: eb-hole 5s ease-in-out infinite; }
    #loader .cl { animation: eb-cl 5s linear infinite; }
    #loader .dim, #loader .arw { animation: eb-dim 5s ease-out infinite; }
    #loader .txt { animation: eb-txt 5s ease-out infinite; }
    @supports (offset-path: path("M0 0")) {
      #loader .pencil { opacity: 1; offset-path: path("M50 60 H250 L280 90 V170 H50 Z"); offset-rotate: 0deg; animation: eb-pencil 5s cubic-bezier(.5,.1,.4,1) infinite; }
    }
    @keyframes eb-draw { 0% { stroke-dashoffset: 1; opacity: 1; } 32%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes eb-hole { 0%, 32% { stroke-dashoffset: 1; opacity: 1; } 48%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes eb-cl { 0%, 46% { opacity: 0; } 54%, 90% { opacity: .9; } 100% { opacity: 0; } }
    @keyframes eb-dim { 0%, 54% { opacity: 0; } 64%, 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes eb-txt { 0%, 62% { opacity: 0; } 72%, 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes eb-pencil { 0% { offset-distance: 0%; opacity: 1; } 32% { offset-distance: 100%; opacity: 1; } 36%, 100% { offset-distance: 100%; opacity: 0; } }
    #loader .brand { display: flex; align-items: baseline; gap: 10px; font-family: "IBM Plex Sans", -apple-system, system-ui, sans-serif; font-weight: 600; font-size: 20px; letter-spacing: .02em; }
    #loader .ver { font-family: inherit; font-size: 12px; font-weight: 400; color: #8a93a0; }
    #loader .status { font-size: 11px; color: #8a93a0; letter-spacing: .18em; text-transform: uppercase; }
    #loader .status::after { content: ""; display: inline-block; width: 1.5em; text-align: left; animation: eb-dots 1.2s steps(4) infinite; }
    @keyframes eb-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    @media (prefers-reduced-motion: reduce) {
      #loader .part, #loader .hole { animation: none; stroke-dashoffset: 0; }
      #loader .cl, #loader .dim, #loader .arw, #loader .txt { animation: none; opacity: 1; }
      #loader .pencil { display: none; }
    }
  </style>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="loader" role="status" aria-label="Loading EngBook">
    <div class="wrap">
      <svg viewBox="0 0 340 230" aria-hidden="true">
        <!-- the part: a plate with a chamfered corner and two holes -->
        <path class="part" pathLength="1" d="M50 60 H250 L280 90 V170 H50 Z"/>
        <circle class="hole" pathLength="1" cx="105" cy="115" r="22"/>
        <circle class="hole" pathLength="1" cx="215" cy="125" r="14"/>
        <!-- centrelines -->
        <path class="cl" d="M75 115 H135 M105 85 V145 M195 125 H235 M215 105 V145"/>
        <!-- dimensions: overall width (top), height (right), hole diameter -->
        <path class="dim" d="M50 56 V30 M280 86 V30 M50 38 H280 M284 60 H312 M284 170 H312 M304 60 V170 M121 99 L150 70 H168"/>
        <path class="arw" d="M50 38 l8 -3 v6 z M280 38 l-8 -3 v6 z M304 60 l-3 8 h6 z M304 170 l-3 -8 h6 z M121 99 l2 -8 l6 6 z"/>
        <text class="txt" x="165" y="33" text-anchor="middle">4.00</text>
        <text class="txt" x="316" y="119" transform="rotate(90 316 119)" text-anchor="middle">2.00</text>
        <text class="txt" x="171" y="73">Ø1.50</text>
        <!-- title block -->
        <path class="dim" d="M180 192 H330 V222 H180 Z M180 207 H330 M280 192 V222"/>
        <text class="txt" x="186" y="203" style="font-size:8px">ENGBOOK</text>
        <text class="txt" x="286" y="203" style="font-size:8px">REV A</text>
        <text class="txt" x="186" y="218" style="font-size:8px">BRACKET, PLATE</text>
        <text class="txt" x="286" y="218" style="font-size:8px">1 OF 1</text>
        <!-- pencil that follows the outline while it is drawn -->
        <g class="pencil"><g transform="rotate(32)">
          <path d="M0 0 L-3.2 -9 H3.2 Z" fill="#e8d3b0"/>
          <path d="M0 0 L-1.1 -3.1 H1.1 Z" fill="#2b2f36"/>
          <rect x="-3.2" y="-44" width="6.4" height="35" fill="#f5a524"/>
          <rect x="-3.2" y="-44" width="2.1" height="35" fill="#fbbf4a"/>
          <rect x="-3.2" y="-49" width="6.4" height="5" fill="#9aa4b2"/>
        </g></g>
      </svg>
      <div class="brand">EngBook <span class="ver">v{{VERSION}}</span></div>
      <div class="status">Drafting</div>
    </div>
  </div>
  <div id="root"></div>
</body>
</html>
