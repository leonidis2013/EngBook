<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EngBook">
  <meta name="format-detection" content="telephone=no">
  <title>EngBook</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/IBMPlexSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Boot screen: a quick engineering sketch of the EngBook logo and wordmark.
       Pure SVG + CSS (no images, no script); about 1.6 s, then it waits for the app. */
    @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/IBMPlexSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background:
      linear-gradient(rgba(34,195,230,.08) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, rgba(34,195,230,.08) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(rgba(34,195,230,.16) 1px, transparent 1px) 0 0 / 120px 120px,
      linear-gradient(90deg, rgba(34,195,230,.16) 1px, transparent 1px) 0 0 / 120px 120px, #0b0d10;
      color: #e6e9ee; font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; transition: opacity .45s ease; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader svg { width: min(680px, 92vw); height: auto; overflow: visible; }
    @media (max-width: 640px) { #loader svg { width: 98vw; } }
    #loader .guide { stroke: #22c3e6; stroke-width: 1; stroke-dasharray: 6 5; opacity: 0; animation: eb-in .35s ease-out .05s forwards; }
    #loader .ln { fill: none; stroke: #f1f5f9; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    #loader .l1 { animation: eb-draw .45s cubic-bezier(.6,.1,.4,1) .15s forwards; }
    #loader .l2 { animation: eb-draw .2s ease-out .55s forwards; }
    #loader .l3 { stroke: #8a93a0; stroke-width: 5; animation: eb-draw .18s ease-out .72s forwards; }
    #loader .l4 { stroke: #8a93a0; stroke-width: 5; animation: eb-draw .18s ease-out .82s forwards; }
    #loader .l5 { stroke: #8a93a0; stroke-width: 5; animation: eb-draw .15s ease-out .92s forwards; }
    #loader .zig { stroke: #22c3e6; stroke-width: 6; animation: eb-draw .3s ease-out 1.02s forwards; }
    #loader .word { font: 600 92px "IBM Plex Sans", -apple-system, system-ui, sans-serif; letter-spacing: 1px; fill: transparent; stroke: #f1f5f9; stroke-width: 1.6;
      stroke-dasharray: 520; stroke-dashoffset: 520; animation: eb-word 1s cubic-bezier(.5,.1,.4,1) .35s forwards, eb-fill .4s ease-out 1.2s forwards; }
    #loader .dim { stroke: #22c3e6; stroke-width: 1.5; fill: none; opacity: 0; animation: eb-in .3s ease-out 1.3s forwards; }
    #loader .arw { fill: #22c3e6; opacity: 0; animation: eb-in .3s ease-out 1.3s forwards; }
    #loader .tag { fill: #22c3e6; font: 500 15px "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing: 3px; opacity: 0; animation: eb-in .3s ease-out 1.4s forwards; }
    #loader .ver { fill: #8a93a0; font: 500 15px "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing: 1px; opacity: 0; animation: eb-in .3s ease-out 1.45s forwards; }
    #loader .status { fill: #8a93a0; font: 500 13px "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing: 4px; opacity: 0; animation: eb-in .3s ease-out 1.5s forwards, eb-blink 1.4s ease-in-out 2s infinite; }
    @keyframes eb-draw { to { stroke-dashoffset: 0; } }
    @keyframes eb-word { to { stroke-dashoffset: 0; } }
    @keyframes eb-fill { to { fill: #f1f5f9; stroke-width: 0; } }
    @keyframes eb-in { to { opacity: 1; } }
    @keyframes eb-blink { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      #loader * { animation: none !important; }
      #loader .ln { stroke-dashoffset: 0; } #loader .word { stroke-dashoffset: 0; fill: #f1f5f9; }
      #loader .guide, #loader .dim, #loader .arw, #loader .tag, #loader .ver, #loader .status { opacity: 1; }
    }
  </style>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="loader" role="status" aria-label="Loading EngBook">
    <svg viewBox="0 0 640 260" aria-hidden="true">
      <!-- construction lines -->
      <path class="guide" d="M10 176 H630 M10 112 H630 M160 30 V230"/>
      <!-- logo: notebook with spine, ruled lines and a signal trace -->
      <g transform="translate(22 48)">
        <path class="ln l1" pathLength="1" d="M10 4 H104 Q116 4 116 16 V148 Q116 160 104 160 H10 Q4 160 4 154 V10 Q4 4 10 4 Z"/>
        <path class="ln l2" pathLength="1" d="M32 4 V160"/>
        <path class="ln l3" pathLength="1" d="M48 42 H96"/>
        <path class="ln l4" pathLength="1" d="M48 66 H96"/>
        <path class="ln l5" pathLength="1" d="M48 90 H80"/>
        <path class="ln zig" pathLength="1" d="M48 126 L60 114 L72 126 L84 114 L96 126"/>
      </g>
      <!-- wordmark -->
      <text class="word" x="176" y="176">EngBook</text>
      <!-- dimension under the wordmark -->
      <path class="dim" d="M178 196 V214 M590 196 V214 M178 206 H590"/>
      <path class="arw" d="M178 206 l11 -4 v8 z M590 206 l-11 -4 v8 z"/>
      <text class="tag" x="384" y="234" text-anchor="middle">ENGINEERING NOTEBOOK</text>
      <text class="ver" x="590" y="98" text-anchor="end">v{{VERSION}}</text>
      <text class="status" x="320" y="258" text-anchor="middle">LOADING</text>
    </svg>
  </div>
  <div id="root"></div>
</body>
</html>
